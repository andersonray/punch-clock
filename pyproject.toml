[project]
name = "punch-clock"
version = "0.0.0"  # the real version lives in custom_components/punch_clock/manifest.json
requires-python = ">=3.14"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PL", "PT", "TID"]
ignore = [
  "PLR0911",  # too many return statements
  "PLR0912",  # too many branches
  "PLR0913",  # too many arguments
  "PLR0915",  # too many statements
  "PLR0917",  # too many positional arguments
  "PLR2004",  # magic values in comparisons
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components", "logic"]
known-local-folder = ["builders", "helpers"]
combine-as-imports = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["custom_components/punch_clock"]
